    <title>Para el amor de mi vida ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, #9b59b6, transparent 30%),
                radial-gradient(circle at 80% 30%, #7b2cbf, transparent 30%),
                radial-gradient(circle at 50% 80%, #d946ef, transparent 30%),
                #080808;

            background-size: 200% 200%;

            animation: moverFondo 12s ease-in-out infinite;
        }


        /* =========================
           FONDO ANIMADO
        ========================= */

        @keyframes moverFondo {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* =========================
           ESTRELLAS
        ========================= */

        .estrella {
            position: fixed;

            width: 4px;
            height: 4px;

            background: white;

            border-radius: 50%;

            box-shadow: 0 0 10px white;

            animation: parpadear 2s infinite alternate;

            z-index: 0;
        }

        .estrella:nth-child(1) {
            top: 15%;
            left: 10%;
        }

        .estrella:nth-child(2) {
            top: 30%;
            left: 85%;

            animation-delay: 0.5s;
        }

        .estrella:nth-child(3) {
            top: 70%;
            left: 15%;

            animation-delay: 1s;
        }

        .estrella:nth-child(4) {
            top: 80%;
            left: 90%;

            animation-delay: 1.5s;
        }

        .estrella:nth-child(5) {
            top: 45%;
            left: 50%;

            animation-delay: 0.8s;
        }


        @keyframes parpadear {

            from {
                opacity: 0.2;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1.5);
            }

        }


        /* =========================
           CORAZONES
        ========================= */

        /* =========================
   MUCHOS CORAZONES
========================= */

/* =========================
   MUCHOS CORAZONES
========================= */

.corazones {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 1;
}

.corazones span {
    position: absolute;

    bottom: -60px;

    font-size: 25px;

    opacity: 0.7;

    animation: corazonesSubir linear infinite;

    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
}

@keyframes corazonesSubir {

    0% {
        transform: translateY(0) rotate(0deg) scale(0.7);
        opacity: 0;
    }

    15% {
        opacity: 0.7;
    }

    50% {
        transform: translateY(-50vh) rotate(180deg) scale(1);
    }

    100% {
        transform: translateY(-115vh) rotate(360deg) scale(0.6);
        opacity: 0;
    }

}

        @keyframes subir {

        /* =========================

        ========================= */

        .portada {
            width: 100%;
            height: 100vh;

            padding: 20px;

        ========================= */

        h1 {

            margin: 0 0 15px;

            text-shadow:
                0 0 10px #d946ef,
                0 0 25px #a855f7,
                0 0 45px #7b2cbf;
        }


        /* =========================
           TEXTO
        ========================= */

        .subtitulo {

            font-size: 21px;

            max-width: 700px;

            line-height: 1.6;

            color: #f3d9ff;

            margin: 0 0 20px;

        }


        /* =========================
           FOTO
        ========================= */

        .foto-nosotros {

            width: 250px;
            height: 250px;

            object-fit: cover;

            display: block;

            border-radius: 50%;

            border: 5px solid white;

            margin: 20px auto;

            box-shadow:
                0 0 15px #a855f7,
                0 0 35px #7b2cbf,
                0 0 60px rgba(155, 89, 255, 0.6);

            transition: 0.4s;

        }


        .foto-nosotros:hover {

            transform: scale(1.08);

            box-shadow:
                0 0 25px white,
                0 0 50px #d946ef,
                0 0 80px #7b2cbf;

        }


        /* =========================
           FECHA
        ========================= */

        .fecha {

            font-size: 20px;

            color: #e9b3ff;

            margin: 5px 0 20px;

        }


        /* =========================
           BOTÓN
        ========================= */

        .boton {

            display: inline-block;

            padding: 14px 30px;

            background: linear-gradient(
                45deg,
                #9b59b6,
                #d946ef
            );

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-weight: bold;

            font-size: 17px;

            box-shadow:
                0 0 15px rgba(217, 70, 239, 0.5);

            transition: 0.3s;

        }


        .boton:hover {

            transform: scale(1.08);

            box-shadow:
                0 0 20px #d946ef,
                0 0 40px #a855f7;

        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            h1 {
                font-size: 36px;
            }

            .subtitulo {
                font-size: 17px;
            }

            .foto-nosotros {
                width: 210px;
                height: 210px;
            }

            .fecha {
                font-size: 17px;
            }

        }
