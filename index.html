<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para el amor de mi vida ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, #9b59b6, transparent 30%),
                radial-gradient(circle at 80% 30%, #7b2cbf, transparent 30%),
                radial-gradient(circle at 50% 80%, #d946ef, transparent 30%),
                #080808;

            background-size: 200% 200%;
            animation: moverFondo 12s ease-in-out infinite;
        }


        /* =========================
           FONDO ANIMADO
        ========================= */

        @keyframes moverFondo {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        /* =========================
           ESTRELLAS
        ========================= */

        .estrella {
            position: fixed;
            color: white;
            font-size: 20px;
            opacity: 0.7;
            animation: parpadear 3s infinite;
            z-index: 0;
        }

        .estrella:nth-child(1) {
            top: 10%;
            left: 15%;
        }

        .estrella:nth-child(2) {
            top: 25%;
            left: 80%;
            animation-delay: 1s;
        }

        .estrella:nth-child(3) {
            top: 70%;
            left: 20%;
            animation-delay: 2s;
        }

        .estrella:nth-child(4) {
            top: 80%;
            left: 75%;
            animation-delay: 1.5s;
        }

        .estrella:nth-child(5) {
            top: 45%;
            left: 50%;
            animation-delay: 0.5s;
        }

        @keyframes parpadear {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }


        /* =========================
           CORAZONES FLOTANDO
        ========================= */

        .corazones {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .corazones span {
            position: absolute;
            bottom: -50px;
            font-size: 22px;
            opacity: 0.7;
            animation: corazonesSubir 10s linear infinite;
        }

        .corazones span:nth-child(1) {
            left: 5%;
            animation-delay: 0s;
        }

        .corazones span:nth-child(2) {
            left: 10%;
            animation-delay: 2s;
        }

        .corazones span:nth-child(3) {
            left: 15%;
            animation-delay: 4s;
        }

        .corazones span:nth-child(4) {
            left: 20%;
            animation-delay: 1s;
        }

        .corazones span:nth-child(5) {
            left: 25%;
            animation-delay: 5s;
        }

        .corazones span:nth-child(6) {
            left: 30%;
            animation-delay: 3s;
        }

        .corazones span:nth-child(7) {
            left: 35%;
            animation-delay: 6s;
        }

        .corazones span:nth-child(8) {
            left: 40%;
            animation-delay: 2s;
        }

        .corazones span:nth-child(9) {
            left: 45%;
            animation-delay: 4s;
        }

        .corazones span:nth-child(10) {
            left: 50%;
            animation-delay: 1s;
        }

        .corazones span:nth-child(11) {
            left: 55%;
            animation-delay: 5s;
        }

        .corazones span:nth-child(12) {
            left: 60%;
            animation-delay: 3s;
        }

        .corazones span:nth-child(13) {
            left: 65%;
            animation-delay: 7s;
        }

        .corazones span:nth-child(14) {
            left: 70%;
            animation-delay: 2s;
        }

        .corazones span:nth-child(15) {
            left: 75%;
            animation-delay: 6s;
        }

        .corazones span:nth-child(16) {
            left: 80%;
            animation-delay: 4s;
        }

        .corazones span:nth-child(17) {
            left: 85%;
            animation-delay: 1s;
        }

        .corazones span:nth-child(18) {
            left: 90%;
            animation-delay: 5s;
        }

        .corazones span:nth-child(19) {
            left: 95%;
            animation-delay: 3s;
        }

        .corazones span:nth-child(20) {
            left: 12%;
            animation-delay: 7s;
        }

        .corazones span:nth-child(21) {
            left: 38%;
            animation-delay: 8s;
        }

        .corazones span:nth-child(22) {
            left: 58%;
            animation-delay: 6s;
        }

        .corazones span:nth-child(23) {
            left: 72%;
            animation-delay: 9s;
        }

        .corazones span:nth-child(24) {
            left: 88%;
            animation-delay: 7s;
        }

        .corazones span:nth-child(25) {
            left: 48%;
            animation-delay: 10s;
        }

        @keyframes corazonesSubir {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            50% {
                transform: translateY(-50vh) rotate(180deg);
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }


        /* =========================
           PORTADA
        ========================= */

        .portada {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            z-index: 2;
        }


        /* =========================
           TITULO
        ========================= */

        h1 {
            font-size: 48px;
            margin: 10px 0;
            text-shadow:
                0 0 10px #ffffff,
                0 0 20px #d946ef,
                0 0 40px #9b59b6;

            animation: aparecer 2s ease;
        }

        .subtitulo {
            font-size: 20px;
            margin: 5px 0 15px;
            color: #f5d9ff;
            animation: aparecer 2.5s ease;
        }


        /* =========================
           FOTO
        ========================= */

        .foto-nosotros {
            width: 250px;
            height: 250px;
            object-fit: cover;
            display: block;

            border-radius: 50%;
            border: 5px solid white;

            margin: 20px auto;

            box-shadow:
                0 0 15px rgba(255, 255, 255, 0.8),
                0 0 35px rgba(217, 70, 239, 0.8);

            transition: 0.5s ease;

            animation: aparecer 2s ease;
        }

        .foto-nosotros:hover {
            transform: scale(1.08) rotate(2deg);

            box-shadow:
                0 0 20px white,
                0 0 50px #d946ef,
                0 0 80px #9b59b6;
        }


        /* =========================
           FECHA
        ========================= */

        .fecha {
            font-size: 18px;
            margin: 10px 0 25px;
            color: #ffe6ff;
            animation: aparecer 3s ease;
        }


        /* =========================
           BOTON
        ========================= */

        .boton {
            display: inline-block;

            padding: 14px 28px;

            background: linear-gradient(
                135deg,
                #9b59b6,
                #d946ef
            );

            color: white;
            text-decoration: none;

            border-radius: 30px;

            font-size: 18px;
            font-weight: bold;

            box-shadow:
                0 0 15px rgba(217, 70, 239, 0.6);

            transition: 0.3s ease;

            animation: aparecer 3.5s ease;
        }

        .boton:hover {
            transform: scale(1.08);
            box-shadow:
                0 0 20px white,
                0 0 40px #d946ef;
        }


        /* =========================
           ANIMACION APARECER
        ========================= */

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           CELULARES
        ========================= */

        @media (max-width: 600px) {

            h1 {
                font-size: 34px;
            }

            .subtitulo {
                font-size: 17px;
            }

            .foto-nosotros {
                width: 210px;
                height: 210px;
            }

            .fecha {
                font-size: 16px;
            }

            .boton {
                font-size: 16px;
                padding: 12px 22px;
            }
        }

    </style>
</head>
